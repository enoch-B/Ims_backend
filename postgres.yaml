apiVersion: v1
kind: Secret
metadata:
  name: ims-secret
type: Opaque
stringData:
  DATABASE_USER: imsuser
  DATABASE_PASSWORD: dummy-local-password
  JWT_SECRET: dummy-local-jwt-secret-at-least-32-characters-long
  BOOTSTRAP_TOKEN: dummy-bootstrap-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: imsdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ims-secret
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ims-secret
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432